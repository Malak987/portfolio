name: protofolio
description: "Malak Ezat — Flutter Developer & UI/UX Designer portfolio."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.10.8

# 🪶 Lean dependencies — everything unused was removed to keep the web build fast & small.
dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/me/me.jpg
    - assets/tools/
    - assets/project_figma/
    - assets/flutter_project/
    - assets/web_projects/

flutter_launcher_icons:
  android: "logo"
  ios: true
  image_path: "assets/tools/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/tools/logo.png"
    background_color: "#0D0D10"
    theme_color: "#C9A96B"
  windows:
    generate: true
    image_path: "assets/tools/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/tools/logo.png"
